<div class="channel">
  <button type="button" [class.on]="isAudible('mix')" (click)="toggle('mix')" title="a mixagem original; liga-la silencia os stems">mix</button>
  <input type="range" min="0" max="1" step="0.01" [value]="volume('mix')" (input)="setVolume('mix', +$any($event.target).value)" title="volume do mix">
  <span class="pan-wrap" [class.centered]="pan('mix') === 0">
    <input type="range" class="pan" min="-1" max="1" step="0.05" [value]="pan('mix')" (input)="setPan('mix', $any($event.target))"
           (dblclick)="setPan('mix', 0)" [title]="'balanço do mix: ' + panLabel('mix') + ' (duplo clique: centro)'">
  </span>
</div>
@for (name of stems() ?? []; track name) {
  <div class="channel">
    <button type="button" [class.on]="isAudible(name)" (click)="toggle(name)" (dblclick)="solo(name)"
            [title]="'clique: liga/desliga (silencia o mix) · duplo clique: só ' + label(name)">
      {{ label(name) }}
    </button>
    <input type="range" min="0" max="1" step="0.01" [value]="volume(name)" (input)="setVolume(name, +$any($event.target).value)"
           [title]="'volume: ' + label(name)">
    <span class="pan-wrap" [class.centered]="pan(name) === 0">
      <input type="range" class="pan" min="-1" max="1" step="0.05" [value]="pan(name)" (input)="setPan(name, $any($event.target))"
             (dblclick)="setPan(name, 0)" [title]="'balanço: ' + label(name) + ' · ' + panLabel(name) + ' (duplo clique: centro)'">
    </span>
  </div>
  <audio #stemAudio [attr.data-stem]="name" preload="auto" muted
         [src]="'/api/tracks/' + trackId() + '/stems/' + name"></audio>
} @empty {
  @if (!stemsLoading()) {
    <span class="muted small-note">sem stems neste run — reprocesse a faixa</span>
  }
}
<div class="channel metronome">
  <button type="button" [class.on]="metronomeOn()" (click)="toggleMetronome()" [disabled]="beats().length === 0"
          [title]="beats().length === 0 ? 'sem beats neste run' : 'metrônomo sobre os beats do extrator (downbeat acentuado); toca por cima de tudo'">
    metrônomo
  </button>
  <input type="range" min="0" max="1" step="0.01" [value]="volume('metronome')" (input)="setVolume('metronome', +$any($event.target).value)" title="volume do metrônomo">
  <span class="pan-wrap" [class.centered]="pan('metronome') === 0">
    <input type="range" class="pan" min="-1" max="1" step="0.05" [value]="pan('metronome')" (input)="setPan('metronome', $any($event.target))"
           (dblclick)="setPan('metronome', 0)" [title]="'balanço do metrônomo: ' + panLabel('metronome') + ' (duplo clique: centro)'">
  </span>
</div>
