<nav class="topbar">
  <a routerLink="/" class="brand" aria-label="Orelha, Music Sense Labs">
    <img src="brand/orelha-signature.svg" alt="" height="64">
    <span class="wordmark">
      <span class="name">Orelha</span>
      <span class="org">Music Sense Labs</span>
    </span>
  </a>
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">acervo</a>
  <a routerLink="/compare" routerLinkActive="active">comparar</a>
  @if (access.admin()) {
    <a routerLink="/admin" routerLinkActive="active">administrador</a>
  }
  <span class="who" [title]="access.remote() ? 'logado pelo Cloudflare Access' : 'acesso local, sem login'">
    {{ access.email() ?? (access.value() ? 'local' : '') }}
  </span>
</nav>
<main>
  <router-outlet />
</main>
