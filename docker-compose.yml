name: orelha

services:
  postgres:
    image: postgres:16-alpine
    container_name: orelha-postgres
    environment:
      POSTGRES_DB: orelha
      POSTGRES_USER: orelha
      POSTGRES_PASSWORD: orelha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orelha -d orelha"]
      interval: 5s
      timeout: 3s
      retries: 10

  extractor:
    build: ./extractor
    image: orelha-extractor
    container_name: orelha-extractor
    environment:
      STEM_FORMAT: opus          # opus | aac | flac | wav (stems persistidos para o player)
    ports:
      - "8000:8000"
    volumes:
      # Bind mounts no host: o backend lê os stems (player multi-stem) e o Parquet daqui.
      - ./data/features:/data/features
      - ./data/stems:/data/stems

volumes:
  pgdata:
