services:
  postgres:
    image: postgres:16-alpine
    container_name: riff-lab-postgres
    environment:
      POSTGRES_DB: rifflab
      POSTGRES_USER: rifflab
      POSTGRES_PASSWORD: rifflab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifflab -d rifflab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
