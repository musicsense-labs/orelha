services:
  postgres:
    image: postgres:16-alpine
    container_name: riff-lab-postgres
    environment:
      POSTGRES_DB: rifflab
      POSTGRES_USER: rifflab
      POSTGRES_PASSWORD: rifflab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifflab -d rifflab"]
      interval: 5s
      timeout: 3s
      retries: 10

  extractor:
    build: ./extractor
    image: riff-extractor
    container_name: riff-lab-extractor
    ports:
      - "8000:8000"
    volumes:
      # Bind mounts no host: o backend lê os stems (player multi-stem) e o Parquet daqui.
      - ./data/features:/data/features
      - ./data/stems:/data/stems

volumes:
  pgdata:
