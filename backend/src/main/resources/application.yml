spring:
  application:
    name: riff-lab
  datasource:
    url: jdbc:postgresql://localhost:5432/rifflab
    username: rifflab
    password: rifflab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: 8080

rifflab:
  extractor:
    url: http://localhost:8000
    timeout: 30m          # uma faixa leva minutos em CPU (demucs + BTC + madmom)
  worker:
    enabled: true
    poll-ms: 5000
  harmony:
    # 0 = desligado. Medido em 2026-09-14: o chroma não separa power chord distorcido de tríade limpa
    # (intermodulação f + 1,5f = terça maior). Ver PowerChordDetector.
    power-chord-third-ratio: 0
