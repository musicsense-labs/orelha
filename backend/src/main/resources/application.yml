spring:
  application:
    name: orelha
  datasource:
    url: jdbc:postgresql://localhost:5432/orelha
    username: orelha
    password: orelha
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  web:
    resources:
      # O Angular compilado (npx ng build em frontend/) é servido pelo backend na mesma origem da API,
      # para o túnel de hospedagem apontar para uma porta só. Ausente = só a API, como sempre.
      static-locations: classpath:/static/, file:../frontend/dist/frontend/browser/
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 2GB      # upload de pasta: lotes de 5 arquivos

server:
  port: 8080

orelha:
  extractor:
    url: http://localhost:8000
    timeout: 30m          # uma faixa leva minutos em CPU (demucs + BTC + madmom)
  data:
    container-root: /data       # como o extrator nomeia seus volumes
    host-root: ${ORELHA_DATA_HOST_ROOT:../data}   # onde o compose faz o bind mount; o mesmo caminho do ORELHA_DATA_DIR
    # Faxina periódica: pasta de stems ou Parquet que não pertence a faixa nenhuma (o extrator grava antes do
    # run ser persistido; run abandonado ou falho deixa sobra). Nunca mexe no que foi tocado há menos de
    # orphan-min-age, e não faz nada se o acervo estiver vazio.
    orphan-sweep-enabled: true
    orphan-min-age: 1h
    orphan-sweep-initial-delay: PT5M
    orphan-sweep-interval: PT6H
  library:
    # Raiz da biblioteca de áudio; track.audio_path é relativo a ela (V6), então mudar de pasta ou de disco
    # é só apontar aqui. Na máquina do dono vem do .env (D:\orelha desde 2026-09-22).
    dir: ${ORELHA_LIBRARY_DIR:../data/audio}          # uploads pela UI: <dir>/<albumId>/<título>.<ext>
  staging:
    dir: ../data/staging        # uploads de pasta entre a pré-visualização e a confirmação
  worker:
    enabled: true
    poll-ms: 5000
    # Enquanto extrai (minutos), o worker bate o ponto no run; quem parou de bater há mais que stale-after
    # foi abandonado (backend derrubado no meio) e volta para a fila, até max-attempts vezes.
    heartbeat: 30s
    stale-after: 2m
    max-attempts: 3
  admin:
    emails: dfcsantos@gmail.com   # quem vê a aba administrador (auditoria); acesso local é sempre admin
  hooktheory:
    url: https://api.hooktheory.com/v1/
    activkey: ${ORELHA_HOOKTHEORY_ACTIVKEY:}   # token da conta do dono (POST /v1/users/auth); vazio = desligado
  musicbrainz:
    url: https://musicbrainz.org/ws/2
    # A API é aberta, mas exige contato no User-Agent e 1 requisição por segundo. Vazio = desligado.
    contact: ${ORELHA_MUSICBRAINZ_CONTACT:}
    app-version: 0.7.0
  harmony:
    # 0 = desligado. Medido em 2026-09-14: o chroma não separa power chord distorcido de tríade limpa
    # (intermodulação f + 1,5f = terça maior). Ver PowerChordDetector.
    power-chord-third-ratio: 0
